<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salesforce Marketing Cloud Next — Guía de estudio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    :root {
      --sf-blue: #0176d3;
      --sf-dark: #032d60;
      --bg: #f3f6f9;
      --sidebar: #ffffff;
      --text: #16325c;
      --muted: #5e6b82;
      --border: #dfe6ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    /* Sidebar */
    aside {
      width: 300px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    aside .brand {
      padding: 0 24px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    aside .brand h1 {
      font-size: 16px;
      margin: 0 0 4px;
      color: var(--sf-dark);
      line-height: 1.3;
    }
    aside .brand span {
      font-size: 12px;
      color: var(--muted);
    }
    nav a {
      display: block;
      padding: 11px 24px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
      cursor: pointer;
    }
    nav a:hover { background: #f0f7ff; }
    nav a.active {
      border-left-color: var(--sf-blue);
      background: #eaf4fe;
      color: var(--sf-blue);
      font-weight: 600;
    }
    .slides-link {
      margin: 16px 24px 0;
      display: block;
      text-align: center;
      background: var(--sf-blue);
      color: #fff !important;
      padding: 10px !important;
      border-radius: 6px;
      border-left: none !important;
      font-weight: 600;
    }
    .slides-link:hover { background: #0b5cab; }
    /* Main */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 48px 24px;
    }
    article {
      max-width: 780px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 48px 56px;
      line-height: 1.7;
    }
    article h1 { color: var(--sf-dark); border-bottom: 2px solid var(--sf-blue); padding-bottom: 10px; }
    article h2 { color: var(--sf-dark); margin-top: 32px; }
    article img { max-width: 100%; border-radius: 8px; margin: 20px 0; border: 1px solid var(--border); }
    article code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px; font-size: 90%; }
    article ul { padding-left: 22px; }
    article a { color: var(--sf-blue); }
    @media (max-width: 800px) {
      body { flex-direction: column; }
      aside { width: 100%; height: auto; position: static; }
      article { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>Salesforce Certified<br>Marketing Cloud Next</h1>
      <span>Guía de estudio</span>
    </div>
    <nav id="nav"></nav>
    <a class="slides-link" href="slides.html">▶ Ver como diapositivas</a>
  </aside>
  <main>
    <article id="content">Cargando…</article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Capítulos de la guía. Para agregar un nuevo capítulo, sumá una línea aquí.
    const CHAPTERS = [
      { title: "1. Introducción", file: "guia/01-introduccion.md" },
      { title: "2. Marketing basado en agentes", file: "guia/02-marketing-basado-en-agentes.md" },
      { title: "3. La evolución de Marketing Cloud", file: "guia/03-evolucion-de-marketing-cloud.md" },
    ];

    const nav = document.getElementById("nav");
    const content = document.getElementById("content");

    async function load(index) {
      document.querySelectorAll("nav a").forEach((a, i) =>
        a.classList.toggle("active", i === index)
      );
      try {
        const res = await fetch(CHAPTERS[index].file);
        const md = await res.text();
        content.innerHTML = marked.parse(md);
        content.scrollIntoView({ behavior: "smooth", block: "start" });
        location.hash = index;
      } catch (e) {
        content.innerHTML = "<p>No se pudo cargar el capítulo. Si estás abriendo el archivo localmente, necesitás un servidor (o publicá con GitHub Pages).</p>";
      }
    }

    CHAPTERS.forEach((ch, i) => {
      const a = document.createElement("a");
      a.textContent = ch.title;
      a.onclick = () => load(i);
      nav.appendChild(a);
    });

    load(Number(location.hash.slice(1)) || 0);
  </script>
</body>
</html>
